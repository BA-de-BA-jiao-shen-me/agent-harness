[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyharness"
version = "0.4.0"
description = "PyHarness: Enterprise DSH-Grade Agent Harness Runtime, Policy Control Plane, Hybrid RAG & Governed Execution Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyyaml>=6.0.0",
    "redis>=5.0.0",
    "opentelemetry-api>=1.25.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",
]
s3 = [
    "boto3>=1.34.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["pyharness*"]
