name: PyHarness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run full unit & API integration test suite
        run: pytest -v
      - name: Run RAG & Harness automated benchmarks
        run: |
          python eval/benchmark_rag.py
          python eval/benchmark_harness.py
